    <script>
        Decimal.set({ precision: 200 });

        let currentLang = localStorage.getItem('methoddka_lang') || 'ja';
        let n = null;
        let scaleFactor = new Decimal(1);

        // 全3フェーズの計算結果を保持する変数
        let phase1Result = null;
        let phase2Result = null;
        let phase3Result = null;

        let savedInitialRootsR = null;
        let savedInitialRootsI = null;

        const i18n = {
            ja: {
                nav: ["🏠 トップ", "🧮 計算", "📖 ヘルプ", "🔒 プライバシー"],
                pageTitle: "MethodDka - 小泉の自動再帰的初期値 (全3フェーズ結果表示)",
                appTitle: "MethodDka (全3フェーズ結果表示対応 v3.1.1)",
                langBtn: "🌐 English",
                desc: `<strong>概要と主な特徴:</strong>
                            <p style="margin: 5px 0;">DKA法と Decimal.js を用い、最大200次までの多項式を高精度に解きます。</p>

                            </ul>`,
                lblPrecision: "個別演算精度:",
                lblDegree: "最高次数 (n ≤ 200):",
                btnGenerate: "入力欄生成",
                btnWilkinson: "🧪 20次ウィルキンソン一発ロード",
                lblBulk: "📋 係数一括ペースト:",
                bulkPlaceholder: "例: 1, -5.5, 3-4j, 0, 1+2i ...",
                btnApplyBulk: "一括反映",
                lblCoeffs: "各項の係数入力:",
                modeRoots: "モード: 高精度解表示",
                modeFactored: "モード: 因数分解表示",
                btnKoizumiPipeline: "🚀 【小泉の再帰的初期値】 50桁→100桁→200桁 全3フェーズ自動計算＆全結果表示！",
                btnCalc: "通常の個別計算開始",
                btnSaveInit: "💾 現在の解を手動保存",
                btnClearInit: "🗑️ 保存初期値をクリア",
                msgComplete: "全3フェーズの計算が正常に完了しました！",
                resultRoot: "解",
                errRadius: "誤差半径",
                iterCount: "収束反復回数",
                totalIter: "全合計反復回数",
                appliedScale: "適用スケール因子 S"
            },
            en: {
                nav: ["🏠 TOP", "🧮 Calculator", "📖 Help", "🔒 Privacy"],
                pageTitle: "MethodDka - Koizumi Recursive Pipeline (All 3 Phases)",
                appTitle: "MethodDka (All 3 Phases Display v3.1.1)",
                langBtn: "🌐 日本語",
                desc: `<strong>Overview & Features:</strong>
                            <p style="margin: 5px 0;">Calculates polynomial roots with high precision using DKA method.</p>
                            <ul>
                                <li><strong>📊 All 3 Phases Display:</strong> Displays results for Phase 1 (50D), Phase 2 (100D), and Phase 3 (200D) sequentially.</li>
                            </ul>`,
                lblPrecision: "Manual Precision:",
                lblDegree: "Polynomial Degree (n ≤ 200):",
                btnGenerate: "Generate Fields",
                btnWilkinson: "🧪 Load 20th Wilkinson",
                lblBulk: "📋 Bulk Coefficients Input:",
                bulkPlaceholder: "e.g., 1, -5.5, 3-4j, 0, 1+2i ...",
                btnApplyBulk: "Apply Bulk Input",
                lblCoeffs: "Individual Coefficients:",
                modeRoots: "Display Mode: High-Precision Roots",
                modeFactored: "Display Mode: Factored Form",
                btnKoizumiPipeline: "🚀 [Koizumi Pipeline] Run All 3 Phases & Display All Results!",
                btnCalc: "Calculate (Manual)",
                btnSaveInit: "💾 Save Roots",
                btnClearInit: "🗑️ Clear",
                msgComplete: "All 3 phases successfully completed!",
                resultRoot: "Root",
                errRadius: "Error Radius",
                iterCount: "Iterations",
                totalIter: "Total Iterations",
                appliedScale: "Scale Factor S"
            }
        };

        function toggleLanguage() {
            currentLang = (currentLang === 'ja') ? 'en' : 'ja';
            localStorage.setItem('methoddka_lang', currentLang);
            updateLanguageUI();
        }

        function updateLanguageUI() {
            const t = i18n[currentLang];
            document.documentElement.lang = currentLang;

            const navLinks = document.querySelectorAll('.nav-bar a');
            t.nav.forEach((text, i) => { navLinks[i].innerText = text; });

            document.getElementById('pageTitle').innerText = t.pageTitle;
            document.getElementById('appTitle').innerText = t.appTitle;
            document.getElementById('langBtn').innerText = t.langBtn;
            document.getElementById('descBox').innerHTML = t.desc;
            document.getElementById('lblPrecision').innerText = t.lblPrecision;
            document.getElementById('lblDegree').innerText = t.lblDegree;
            document.getElementById('btnGenerate').innerText = t.btnGenerate;
            document.getElementById('btnWilkinson').innerText = t.btnWilkinson;
            document.getElementById('lblBulk').innerText = t.lblBulk;
            document.getElementById('bulkCoeffs').placeholder = t.bulkPlaceholder;
            document.getElementById('btnApplyBulk').innerText = t.btnApplyBulk;
            document.getElementById('lblCoeffs').innerText = t.lblCoeffs;
            document.getElementById('btnKoizumiPipeline').innerText = t.btnKoizumiPipeline;
            document.getElementById('btnCalc').innerText = t.btnCalc;
            document.getElementById('btnSaveInit').innerText = t.btnSaveInit;
            document.getElementById('btnClearInit').innerText = t.btnClearInit;

            if (n !== null) {
                for (let i = 0; i <= n; i++) {
                    const lbl = document.getElementById(`coeffLabel_${i}`);
                    if (lbl) lbl.textContent = `a_${n - i} (x^${n - i}):`;
                }
            }

            if (phase3Result) {
                renderAllPhasesResults();
            }
        }

        function createFields() {
            n = parseInt(document.getElementById('maxDegree').value);
            if (isNaN(n) || n < 1 || n > 200) { alert("次数は1〜200で指定してください"); return; }
            const div = document.getElementById('coefficients');
            div.innerHTML = '';
            for (let i = 0; i <= n; i++) {
                const row = document.createElement('div'); row.className = 'coeff-row';
                const lbl = document.createElement('span'); lbl.className = 'coeff-label'; lbl.id = `coeffLabel_${i}`;
                lbl.textContent = `a_${n - i} (x^${n - i}):`;
                const input = document.createElement('input'); input.type = 'text'; input.id = `coeff${i}`; input.value = i === 0 ? '1' : '0';
                row.appendChild(lbl); row.appendChild(input); div.appendChild(row);
            }
            document.getElementById('pasteSection').style.display = 'block';
        }

        function loadWilkinson20() {
            document.getElementById('maxDegree').value = 20;
            createFields();
            const wilkinsonCoeffs = [
                "1", "-210", "20615", "-1256850", "53327946", "-1672280820",
                "40171771630", "-756111184500", "11310276995381", "-135585182899530",
                "1307535010540395", "-10142299865511450", "63030812099294896",
                "-311333643161390640", "1206647803780373360", "-3599979517947607200",
                "8037811822645051392", "-12870931245150988000", "13803759753640704000",
                "-8752948036761600000", "2432902008176640000"
            ];
            for (let i = 0; i <= 20; i++) {
                document.getElementById('coeff' + i).value = wilkinsonCoeffs[i];
            }
            alert("20次ウィルキンソン多項式の係数をロードしました！");
        }

        function applyBulkCoefficients() {
            const rawText = document.getElementById('bulkCoeffs').value.trim();
            if (!rawText) { alert("テキストを入力してください"); return; }
            let values = rawText.includes(',') ? rawText.split(',').map(v => v.trim()).filter(v => v.length > 0) : rawText.split(/[\s]+/).filter(v => v.length > 0);
            if (values.length < n + 1) { alert("係数の数が足りません"); return; }
            for (let i = 0; i <= n; i++) { document.getElementById('coeff' + i).value = values[i]; }
            alert("一括反映しました！");
        }

        function saveCurrentRootsAsInitial() {
            if (!phase3Result || phase3Result.sr.length <= 1) { alert("保存する計算結果がありません。"); return; }
            savedInitialRootsR = [...phase3Result.sr];
            savedInitialRootsI = [...phase3Result.si];
            document.getElementById('savedInitStatus').innerText = "✨ 現在の解を初期値として手動保存しました！";
            document.getElementById('btnClearInit').style.display = 'inline-block';
        }

        function clearSavedInitial() {
            savedInitialRootsR = null;
            savedInitialRootsI = null;
            document.getElementById('savedInitStatus').innerText = "🗑️ 保存された初期値をクリアしました。";
            document.getElementById('btnClearInit').style.display = 'none';
        }

        function parseComplex(str) {
            str = str.replace(/\s+/g, '').toLowerCase().replace(/j/g, 'i');
            if (!str) return { r: new Decimal(0), i: new Decimal(0) };
            if (str === 'i' || str === '+i') return { r: new Decimal(0), i: new Decimal(1) };
            if (str === '-i') return { r: new Decimal(0), i: new Decimal(-1) };
            let splitIdx = -1;
            for (let i = str.length - 1; i > 0; i--) { if ((str[i] === '+' || str[i] === '-') && str[i - 1] !== 'e') { splitIdx = i; break; } }
            if (splitIdx !== -1 && str.endsWith('i')) {
                let rStr = str.substring(0, splitIdx), iStr = str.substring(splitIdx).replace('i', '');
                if (rStr === '') rStr = '0'; if (iStr === '+' || iStr === '') iStr = '1'; if (iStr === '-') iStr = '-1';
                return { r: new Decimal(rStr), i: new Decimal(iStr) };
            } else {
                if (str.endsWith('i')) {
                    let iStr = str.replace('i', '');
                    if (iStr === '+' || iStr === '') iStr = '1'; if (iStr === '-') iStr = '-1';
                    return { r: new Decimal(0), i: new Decimal(0) };
                } else { return { r: new Decimal(str), i: new Decimal(0) }; }
            }
        }

        // 汎用DKA計算エンジン
        async function runDkaEngine(precision, customInitR, customInitI, progressCallback) {
            Decimal.set({ precision: precision });

            let origAR = [], origAI = [];
            for (let i = 0; i <= n; i++) {
                let c = parseComplex(document.getElementById('coeff' + i).value || "0");
                origAR[i] = c.r; origAI[i] = c.i;
            }

            if (!origAR[n].isZero() || !origAI[n].isZero()) {
                let magN = origAR[n].pow(2).add(origAI[n].pow(2)).sqrt();
                let mag0 = origAR[0].pow(2).add(origAI[0].pow(2)).sqrt();
                scaleFactor = magN.div(mag0).pow(new Decimal(1).div(n));
            } else { scaleFactor = new Decimal(1); }

            let localSaR = [], localSaI = [];
            let denom0 = origAR[0].pow(2).add(origAI[0].pow(2));
            for (let i = 0; i <= n; i++) {
                let sPow = scaleFactor.pow(i);
                let nr = origAR[i].mul(origAR[0]).add(origAI[i].mul(origAI[0])).div(denom0);
                let ni = origAI[i].mul(origAR[0]).sub(origAR[i].mul(origAI[0])).div(denom0);
                localSaR[i] = nr.div(sPow); localSaI[i] = ni.div(sPow);
            }

            let localSr = [], localSi = [], localSErr = [], localSIter = [];
            for (let i = 1; i <= n; i++) localSIter[i] = 0;

            if (customInitR && customInitR.length === n + 1) {
                for (let j = 1; j <= n; j++) {
                    localSr[j] = new Decimal(customInitR[j]).div(scaleFactor);
                    localSi[j] = new Decimal(customInitI[j]).div(scaleFactor);
                }
            } else {
                let sp = Decimal.acos(-1), initR = new Decimal(1.5);
                for (let j = 1; j <= n; j++) {
                    let ang = new Decimal(2).mul(sp).mul(j).div(n), perturbation = new Decimal(1).add(new Decimal(j).mul("0.01"));
                    localSr[j] = initR.mul(perturbation).mul(Decimal.cos(ang));
                    localSi[j] = initR.mul(perturbation).mul(Decimal.sin(ang));
                }
            }

            const maxIter = 1000;
            const targetTolerance = precision >= 200 ? new Decimal("1e-180") : (precision >= 100 ? new Decimal("1e-94") : new Decimal("1e-44"));

            for (let k = 1; k <= maxIter; k++) {
                if (k % 10 === 0 && progressCallback) {
                    progressCallback(precision, k, maxIter);
                    await new Promise(r => setTimeout(r, 0));
                }
                let bContinue = false;
                for (let i = 1; i <= n; i++) {
                    if (localSErr[i] && localSErr[i].lte(targetTolerance)) continue;
                    let pr = localSaR[0], pi = localSaI[0];
                    for (let j = 1; j <= n; j++) {
                        let nr = pr.mul(localSr[i]).sub(pi.mul(localSi[i])).add(localSaR[j]);
                        let ni = pr.mul(localSi[i]).add(pi.mul(localSr[i])).add(localSaI[j]);
                        pr = nr; pi = ni;
                    }
                    let dr = new Decimal(1), di = new Decimal(0);
                    for (let j = 1; j <= n; j++) {
                        if (i === j) continue;
                        let diffR = localSr[i].sub(localSr[j]), diffI = localSi[i].sub(localSi[j]);
                        let nr = dr.mul(diffR).sub(di.mul(diffI));
                        di = dr.mul(diffI).add(di.mul(diffR)); dr = nr;
                    }
                    let mag = dr.mul(dr).add(di.mul(di));
                    let ur = (pr.mul(dr).add(pi.mul(di))).div(mag), ui = (pi.mul(dr).sub(pr.mul(di))).div(mag);
                    localSr[i] = localSr[i].sub(ur); localSi[i] = localSi[i].sub(ui);
                    localSErr[i] = ur.abs().add(ui.abs()); localSIter[i] = k;
                    if (localSErr[i].gt(targetTolerance)) bContinue = true;
                }
                if (!bContinue) break;
            }

            for (let i = 1; i <= n; i++) {
                localSr[i] = localSr[i].mul(scaleFactor);
                localSi[i] = localSi[i].mul(scaleFactor);
                if (localSErr[i]) localSErr[i] = localSErr[i].mul(scaleFactor);
            }

            return { sr: localSr, si: localSi, sErr: localSErr, sIter: localSIter };
        }

        // 🚀 全3フェーズ自動実行パイプライン
        async function startKoizumiRecursivePipeline() {
            const t = i18n[currentLang];
            if (n === null) { alert("最初に入力欄を生成してください"); return; }

            const prog = document.getElementById('progress');

            // 第1フェーズ (50桁)
            prog.innerText = `🔥 [Phase 1/3] 50桁精度で初期探索中...`;
            phase1Result = await runDkaEngine(50, null, null, (prec, k, max) => {
                prog.innerText = `🔥 [Phase 1/3] 50桁精度計算中 (Loop: ${k}/${max})`;
            });

            let init1R = [], init1I = [];
            for (let i = 1; i <= n; i++) { init1R[i] = phase1Result.sr[i]; init1I[i] = phase1Result.si[i]; }

            // 第2フェーズ (100桁)
            prog.innerText = `✨ [Phase 2/3] 100桁精度へ再帰的引き継ぎ & 収束中...`;
            phase2Result = await runDkaEngine(100, init1R, init1I, (prec, k, max) => {
                prog.innerText = `✨ [Phase 2/3] 100桁精度計算中 (Loop: ${k}/${max})`;
            });

            let init2R = [], init2I = [];
            for (let i = 1; i <= n; i++) { init2R[i] = phase2Result.sr[i]; init2I[i] = phase2Result.si[i]; }

            // 第3フェーズ (200桁 限界突破)
            prog.innerText = `🚀 [Phase 3/3] 200桁精度へ再帰的引き継ぎ & 極限完全収束中...`;
            phase3Result = await runDkaEngine(200, init2R, init2I, (prec, k, max) => {
                prog.innerText = `🚀 [Phase 3/3] 200桁限界突破計算中 (Loop: ${k}/${max})`;
            });

            prog.innerText = t.msgComplete;
            renderAllPhasesResults();
        }

        // 通常の個別計算
        async function startCalculation() {
            if (n === null) { alert("最初に入力欄を生成してください"); return; }
            const selectedPrecision = parseInt(document.getElementById('precisionSelect').value);
            const prog = document.getElementById('progress');
            prog.innerText = "個別計算中...";

            let customR = (savedInitialRootsR && savedInitialRootsR.length === n + 1) ? savedInitialRootsR : null;
            let customI = (savedInitialRootsI && savedInitialRootsI.length === n + 1) ? savedInitialRootsI : null;

            let res = await runDkaEngine(selectedPrecision, customR, customI, (prec, k, max) => {
                prog.innerText = `個別計算中 (Prec: ${selectedPrecision}, Loop: ${k}/${max})`;
            });

            phase3Result = res; // 個別計算結果もフェーズ3枠に表示
            phase1Result = null; phase2Result = null;
            renderSingleResult(res, selectedPrecision);
            prog.innerText = "個別計算完了";
        }

        // 全3フェーズの結果を描画する関数
        renderAllPhasesResults = () => {
            if (!phase3Result) return;
            const container = document.getElementById('resultsContainer');
            container.innerHTML = '';

            const phases = [
                { title: "🔥 第1フェーズ結果 (50桁精度 / 初期探索)", data: phase1Result, prec: 50 },
                { title: "✨ 第2フェーズ結果 (100桁精度 / 中間収束)", data: phase2Result, prec: 100 },
                { title: "🚀 第3フェーズ結果 (200桁精度 / 限界突破極限収束)", data: phase3Result, prec: 200 }
            ];

            phases.forEach(p => {
                if (!p.data) return;
                let html = `<div class="phase-section"><div class="phase-title">${p.title}</div>`;
                let totalIter = 0;
                const isFactorMode = document.getElementById('modeToggle').checked;

                for (let i = 1; i <= n; i++) {
                    let errVal = p.data.sErr[i] || new Decimal(1);
                    let isBad = errVal.gte("1e-35");
                    totalIter += p.data.sIter[i];
                    let outputStr = "";

                    if (isFactorMode) {
                        let re = Math.round(Number(p.data.sr[i])), im = Math.round(Number(p.data.si[i]));
                        let rootStr = im === 0 ? `${re}` : (im > 0 ? `${re} + ${im}i` : `${re} - ${Math.abs(im)}i`);
                        outputStr = `因数 ${i}: (x - (${rootStr}))`;
                    } else {
                        let signStr = p.data.si[i].gte(0) ? '+' : '-';
                        outputStr = `解 ${i}: ${p.data.sr[i].toFixed(p.prec)} ${signStr} ${p.data.si[i].abs().toFixed(p.prec)}i`;
                    }
                    html += `<div class="result-card">${outputStr}<br><span class="${isBad ? 'err-warn' : 'err-ok'}">誤差半径: ${errVal.toExponential(4)}</span><br><strong>収束反復回数: ${p.data.sIter[i]}</strong></div>`;
                }
                html += `<div class="summary-card"><strong>全合計反復回数: ${totalIter}</strong><br><span>（適用スケール因子 S: ${scaleFactor.toFixed(10)}）</span></div></div>`;
                container.innerHTML += html;
            });
        }

        // 個別計算の結果を描画する関数
        function renderSingleResult(res, prec) {
            const container = document.getElementById('resultsContainer');
            container.innerHTML = '';
            let html = `<div class="phase-section"><div class="phase-title">🧮 個別計算結果 (${prec}桁精度)</div>`;
            let totalIter = 0;
            const isFactorMode = document.getElementById('modeToggle').checked;

            for (let i = 1; i <= n; i++) {
                let errVal = res.sErr[i] || new Decimal(1);
                let isBad = errVal.gte("1e-35");
                totalIter += res.sIter[i];
                let signStr = res.si[i].gte(0) ? '+' : '-';
                let outputStr = `解 ${i}: ${res.sr[i].toFixed(prec)} ${signStr} ${res.si[i].abs().toFixed(prec)}i`;
                html += `<div class="result-card">${outputStr}<br><span class="${isBad ? 'err-warn' : 'err-ok'}">誤差半径: ${errVal.toExponential(4)}</span><br><strong>収束反復回数: ${res.sIter[i]}</strong></div>`;
            }
            html += `<div class="summary-card"><strong>全合計反復回数: ${totalIter}</strong><br><span>（適用スケール因子 S: ${scaleFactor.toFixed(10)}）</span></div></div>`;
            container.innerHTML += html;
        }

        window.onload = () => {
            document.documentElement.lang = currentLang;
            updateLanguageUI();
            createFields();
        };
    </script>
