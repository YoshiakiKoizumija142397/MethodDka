<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">MethodDka - 複素数一括読み込み & ウィルキンソン生成対応</title>
    <!-- Decimal.js (50桁高精度演算ライブラリ) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/decimal.js/10.4.3/decimal.min.js"></script>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #212529;
            --primary-color: #0d6efd;
            --primary-hover: #0b5ed7;
            --success-color: #198754;
            --success-hover: #157347;
            --border-color: #dee2e6;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }
        h1 {
            font-size: 1.6rem;
            margin: 0;
            color: #000;
        }
        .lang-switch-btn {
            background-color: #e9ecef;
            color: #495057;
            border: 1px solid #ced4da;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            transition: all 0.2s;
        }
        .lang-switch-btn:hover {
            background-color: #dee2e6;
        }
        .desc-box {
            background-color: #f1f3f5;
            padding: 15px 20px;
            border-radius: 6px;
            border-left: 4px solid var(--primary-color);
            margin-bottom: 25px;
            font-size: 0.9rem;
            line-height: 1.6;
        }
        .desc-box ul {
            margin: 8px 0 0 20px;
            padding: 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }
        input[type="number"], input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }
        textarea {
            height: 130px;
            font-family: monospace;
            resize: vertical;
        }
        .coeff-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }
        .coeff-label {
            width: 110px;
            font-family: monospace;
            font-size: 0.9rem;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        button.secondary {
            background-color: #6c757d;
        }
        button.secondary:hover {
            background-color: #5c636a;
        }
        button.success {
            background-color: var(--success-color);
        }
        button.success:hover {
            background-color: var(--success-hover);
        }
        #progress {
            margin: 15px 0;
            font-weight: bold;
            color: var(--primary-color);
        }
        .toggle-box {
            margin: 15px 0;
            padding: 12px;
            background: #f1f3f5;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid var(--border-color);
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 24px;
        }
        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #adb5bd;
            transition: .3s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: var(--primary-color);
        }
        input:checked + .slider:before {
            transform: translateX(24px);
        }
        .result-card {
            margin-top: 10px;
            padding: 12px;
            background-color: #f8f9fa;
            border-radius: 6px;
            font-family: monospace;
            border-left: 5px solid var(--primary-color);
            border-top: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            word-break: break-all;
        }
        .summary-card {
            margin-top: 15px;
            padding: 12px;
            background-color: #d1e7dd;
            border-radius: 6px;
            font-family: monospace;
            border-left: 5px solid #0f5132;
            color: #0f5132;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-row">
            <h1 id="appTitle">MethodDka (200次対応 & 50桁高精度)</h1>
            <button type="button" class="lang-switch-btn" onclick="toggleLanguage()" id="langBtn">🌐 English</button>
        </div>

        <!-- アプリ説明エリア -->
        <div class="desc-box" id="descBox">
            <!-- JSで動的に設定 -->
        </div>

        <!-- 次数入力 & ウィルキンソン生成ボタン -->
        <div class="form-group">
            <label for="maxDegree" id="lblDegree">最高次数 (n ≤ 200):</label>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <input type="number" id="maxDegree" value="15" min="1" max="200" style="max-width: 150px;">
                <button type="button" class="secondary" onclick="createFields()" id="btnGenerate">入力欄生成</button>
                <button type="button" class="success" onclick="generateWilkinson15()" id="btnWilkinson">🧪 15次ウィルキンソン係数を生成</button>
            </div>
        </div>

        <!-- 係数一括ペースト (i, j 複素数対応) -->
        <div id="pasteSection" class="form-group">
            <label for="bulkCoeffs" id="lblBulk">📋 係数データの一括ペースト (i, j 複素数対応 / スペース・改行・カンマ区切り):</label>
            <textarea id="bulkCoeffs" placeholder="例: 1, -120, 3+4i, 5-2j ..."></textarea>
            <button type="button" class="secondary" style="margin-top: 8px; padding: 6px 15px; font-size: 0.85rem;" onclick="applyBulkCoefficients(true)" id="btnApplyBulk">一括反映</button>
        </div>

        <!-- 個別係数入力欄 -->
        <div class="form-group">
            <label id="lblCoeffs">各項の係数入力:</label>
            <div id="coefficients"></div>
        </div>

        <!-- モード切替トグル -->
        <div class="toggle-box">
            <span id="toggleText" style="font-weight: bold; color: #333;">モード: 50桁高精度解表示</span>
            <label class="switch">
                <input type="checkbox" id="modeToggle" onchange="renderResults()">
                <span class="slider"></span>
            </label>
        </div>

        <!-- 計算ボタン & 進捗表示 -->
        <div class="btn-group">
            <button type="button" onclick="startCalculation()" id="btnCalc">計算開始</button>
        </div>
        <div id="progress"></div>

        <!-- 結果出力欄 -->
        <div id="results"></div>
    </div>

    <script>
        Decimal.set({ precision: 50 });
        let currentLang = 'ja';
        let n = null;
        let sa_r = [], sa_i = [], sr = [], si = [], sErr = [], sIter = [];
        let scaleFactor = new Decimal(1);

        const i18n = {
            ja: {
                pageTitle: "MethodDka - 複素数一括読み込み & ウィルキンソン生成対応",
                appTitle: "MethodDka (200次対応 & 50桁高精度)",
                langBtn: "🌐 English",
                desc: `<strong>概要と主な特徴:</strong> <p style="margin: 5px 0;">DKA法とDecimal.jsを用い、最大200次までの多項式の全根を高精度に計算します。</p>
                       <ul>
                         <li><strong>50桁超高精度演算:</strong> 桁あふれ・情報落ちを防ぎ安定した計算精度を保持。</li>
                         <li><strong>複素数一括読み込み ('i'/'j' 完全対応):</strong> 「1+2i」や「3-4j」等の複素数係数を一括ペースト可能。</li>
                         <li><strong>15次ウィルキンソン係数生成:</strong> ボタン一つで検証用データを自動生成・セット。</li>
                       </ul>`,
                lblDegree: "最高次数 (n ≤ 200):",
                btnGenerate: "入力欄生成",
                btnWilkinson: "🧪 15次ウィルキンソン係数を生成",
                lblBulk: "📋 係数データの一括ペースト (i, j 複素数対応 / スペース・改行・カンマ区切り):",
                btnApplyBulk: "一括反映",
                lblCoeffs: "各項の係数入力 (a_n * x^n + ... + a_0):",
                modeRoots: "モード: 50桁高精度解表示",
                modeFactored: "モード: 因数分解表示（小数第1位で四捨五入）",
                btnCalc: "計算開始",
                msgScaling: "スケーリング計算中...",
                msgCalculating: "計算中...",
                msgComplete: "計算完了",
                resultRoot: "解",
                resultFactor: "因数",
                errRadius: "誤差半径",
                iterCount: "収束反復回数",
                totalIter: "全合計反復回数",
                appliedScale: "適用スケール因子 S",
                alertDegree: "次数は1から200の範囲で指定してください",
                alertBulkDone: (count) => `${count} 件の係数を一括セットしました！`,
                alertZeroLead: "最高次の係数は0以外を入力してください",
                alertInvalidCoeff: (idx) => `${idx}次の係数に不正な値が含まれています`
            },
            en: {
                pageTitle: "MethodDka - Complex Bulk Input & Wilkinson Generator",
                appTitle: "MethodDka (Max Degree 200 & 50-Digit Precision)",
                langBtn: "🌐 日本語",
                desc: `<strong>Overview & Features:</strong> <p style="margin: 5px 0;">Calculates all real and complex roots of polynomials up to degree 200 with ultra-high precision.</p>
                       <ul>
                         <li><strong>50-Digit High Precision:</strong> Powered by Decimal.js to prevent numerical issues.</li>
                         <li><strong>Complex Bulk Input ('i'/'j' supported):</strong> Paste complex coefficients like 1+2i or 3-4j seamlessly.</li>
                         <li><strong>Wilkinson Generator:</strong> Automatically generate and set 15th-degree Wilkinson benchmark data.</li>
                       </ul>`,
                lblDegree: "Polynomial Degree (n ≤ 200):",
                btnGenerate: "Generate Fields",
                btnWilkinson: "🧪 Generate 15th Wilkinson",
                lblBulk: "📋 Bulk Coefficients Input (Supports 'i' & 'j' / Space, Comma, Line-separated):",
                btnApplyBulk: "Apply Bulk Input",
                lblCoeffs: "Individual Coefficients (a_n * x^n + ... + a_0):",
                modeRoots: "Display Mode: 50-Digit High-Precision Roots",
                modeFactored: "Display Mode: Factored Form (Rounded for Readability)",
                btnCalc: "Calculate Roots",
                msgScaling: "Scaling coefficients...",
                msgCalculating: "Calculating...",
                msgComplete: "Calculation Completed",
                resultRoot: "Root",
                resultFactor: "Factor",
                errRadius: "Residual / Error Radius",
                iterCount: "Iterations",
                totalIter: "Total Iterations",
                appliedScale: "Applied Scale Factor S",
                alertDegree: "Please enter a degree between 1 and 200.",
                alertBulkDone: (count) => `Successfully set ${count} coefficients!`,
                alertZeroLead: "Leading coefficient a_n cannot be zero.",
                alertInvalidCoeff: (idx) => `Invalid coefficient value at degree ${idx}`
            }
        };

        function toggleLanguage() {
            currentLang = (currentLang === 'ja') ? 'en' : 'ja';
            document.documentElement.lang = currentLang;
            updateLanguageUI();
        }

        function updateLanguageUI() {
            const t = i18n[currentLang];
            document.getElementById('pageTitle').innerText = t.pageTitle;
            document.getElementById('appTitle').innerText = t.appTitle;
            document.getElementById('langBtn').innerText = t.langBtn;
            document.getElementById('descBox').innerHTML = t.desc;
            document.getElementById('lblDegree').innerText = t.lblDegree;
            document.getElementById('btnGenerate').innerText = t.btnGenerate;
            document.getElementById('btnWilkinson').innerText = t.btnWilkinson;
            document.getElementById('lblBulk').innerText = t.lblBulk;
            document.getElementById('btnApplyBulk').innerText = t.btnApplyBulk;
            document.getElementById('lblCoeffs').innerText = t.lblCoeffs;
            document.getElementById('btnCalc').innerText = t.btnCalc;
            document.getElementById('toggleText').innerText = document.getElementById('modeToggle').checked ? t.modeFactored : t.modeRoots;

            if (n !== null) {
                for (let i = 0; i <= n; i++) {
                    const lbl = document.getElementById(`coeffLabel_${i}`);
                    if (lbl) lbl.textContent = `a_${n - i} (x^${n - i}):`;
                }
            }
            renderResults();
        }

        function createFields() {
            const t = i18n[currentLang];
            n = parseInt(document.getElementById('maxDegree').value);
            if (isNaN(n) || n < 1 || n > 200) {
                alert(t.alertDegree);
                return;
            }
            const div = document.getElementById('coefficients');
            div.innerHTML = '';
            for (let i = 0; i <= n; i++) {
                const row = document.createElement('div');
                row.className = 'coeff-row';

                const lbl = document.createElement('span');
                lbl.className = 'coeff-label';
                lbl.id = `coeffLabel_${i}`;
                lbl.textContent = `a_${n - i} (x^${n - i}):`;

                const input = document.createElement('input');
                input.type = 'text';
                input.id = `coeff${i}`;
                input.value = '0';

                row.appendChild(lbl);
                row.appendChild(input);
                div.appendChild(row);
            }
        }

        // 15次ウィルキンソン係数を自動生成してセットする機能
        function generateWilkinson15() {
            n = 15;
            document.getElementById('maxDegree').value = n;
            createFields();

            // 15次ウィルキンソン多項式の厳密な係数データ
            const wilkinsonCoeffs = [
                "1",
                "-120",
                "6440",
                "-206140",
                "4363680",
                "-64335072",
                "676646560",
                "-5147814080",
                "28359288160",
                "-113400587520",
                "324103138816",
                "-646274431488",
                "856515582720",
                "-687258950400",
                "300445555200",
                "-1307674368000"
            ];

            document.getElementById('bulkCoeffs').value = wilkinsonCoeffs.join("\n");
            applyBulkCoefficients(false);
        }

        function applyBulkCoefficients(showAlert = true) {
            const t = i18n[currentLang];
            const rawText = document.getElementById('bulkCoeffs').value.trim();
            if (!rawText) return;

            const values = rawText.split(/[\s,]+/).filter(v => v.length > 0);
            
            if (values.length >= 2 && values.length <= 201) {
                n = values.length - 1;
                document.getElementById('maxDegree').value = n;
                
                const div = document.getElementById('coefficients');
                div.innerHTML = '';
                for (let i = 0; i <= n; i++) {
                    const row = document.createElement('div');
                    row.className = 'coeff-row';
                    const lbl = document.createElement('span');
                    lbl.className = 'coeff-label';
                    lbl.id = `coeffLabel_${i}`;
                    lbl.textContent = `a_${n - i} (x^${n - i}):`;
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.id = `coeff${i}`;
                    input.value = values[i];
                    row.appendChild(lbl);
                    row.appendChild(input);
                    div.appendChild(row);
                }
                if (showAlert) alert(t.alertBulkDone(n + 1));
            }
        }

        window.onload = function() {
            // 初期状態で15次ウィルキンソン係数を自動生成してロード
            generateWilkinson15();
        };

        // 複素数パース ('i' または電気工学の 'j' に完全対応)
        function parseComplex(str) {
            let s = str.replace(/\s+/g, '').toLowerCase().replace(/j/g, 'i');
            if (s === '') return { r: new Decimal(0), i: new Decimal(0) };
            let re = "0", im = "0";
            if (!s.includes('i')) {
                re = s;
            } else {
                s = s.replace('i', '');
                if (s === '' || s === '+') {
                    im = "1"; re = "0";
                } else if (s === '-') {
                    im = "-1"; re = "0";
                } else {
                    let splitIdx = -1;
                    for (let k = s.length - 1; k >= 0; k--) {
                        if ((s[k] === '+' || s[k] === '-') && (k === 0 || (s[k-1] !== 'e' && s[k-1] !== 'E'))) {
                            splitIdx = k;
                            break;
                        }
                    }
                    if (splitIdx <= 0) {
                        im = (s === '+' ? "1" : (s === '-' ? "-1" : s));
                    } else {
                        re = s.substring(0, splitIdx);
                        im = s.substring(splitIdx);
                        if (im === '+') im = "1";
                        if (im === '-') im = "-1";
                    }
                }
            }
            return { r: new Decimal(re), i: new Decimal(im) };
        }

        function decimalHypot(r, i) {
            return r.mul(r).add(i.mul(i)).sqrt();
        }

        async function startCalculation() {
            const t = i18n[currentLang];
            if (n === null) return;

            let origA_r = [], origA_i = [];
            for (let idx = 0; idx <= n; idx++) {
                try {
                    let parsed = parseComplex(document.getElementById('coeff' + idx).value || "0");
                    origA_r[idx] = parsed.r;
                    origA_i[idx] = parsed.i;
                } catch (e) {
                    alert(t.alertInvalidCoeff(n - idx));
                    return;
                }
            }

            if (origA_r[0].isZero() && origA_i[0].isZero()) {
                alert(t.alertZeroLead);
                return;
            }

            const prog = document.getElementById('progress');
            prog.innerText = t.msgScaling;

            // --- 1. オートスケーリング（規格化） ---
            let mag0 = decimalHypot(origA_r[0], origA_i[0]);
            let magN = decimalHypot(origA_r[n], origA_i[n]);
            if (!magN.isZero()) {
                scaleFactor = magN.div(mag0).pow(new Decimal(1).div(n));
            } else {
                scaleFactor = new Decimal(1);
            }

            sa_r = []; sa_i = [];
            for (let idx = 0; idx <= n; idx++) {
                let sPow = scaleFactor.pow(idx);
                let div_r = origA_r[0].mul(sPow);
                let div_i = origA_i[0].mul(sPow);
                let den = div_r.mul(div_r).add(div_i.mul(div_i));
                sa_r[idx] = (origA_r[idx].mul(div_r).add(origA_i[idx].mul(div_i))).div(den);
                sa_i[idx] = (origA_i[idx].mul(div_r).sub(origA_r[idx].mul(div_i))).div(den);
            }

            // --- 2. 初期値の設定 ---
            sErr = [];
            for (let i = 1; i <= n; i++) sIter[i] = 0;
            let sp = Decimal.acos(-1);
            let initR = new Decimal(1.5);
            for (let j = 1; j <= n; j++) {
                let ang = new Decimal(2).mul(sp).mul(j).div(n);
                let perturbation = new Decimal(1).add(new Decimal(j).mul("0.01"));
                sr[j] = initR.mul(perturbation).mul(Decimal.cos(ang));
                si[j] = initR.mul(perturbation).mul(Decimal.sin(ang));
            }

            // --- 3. DKA法 反復計算 ---
            const maxIter = 25000;
            const targetTolerance = new Decimal("1e-40");

            for (let k = 1; k <= maxIter; k++) {
                if (k % 25 === 0) {
                    prog.innerText = `${t.msgCalculating} (Loop: ${k} / ${maxIter}, Deg: ${n})`;
                    await new Promise(r => setTimeout(r, 0));
                }

                let bContinue = false;
                for (let i = 1; i <= n; i++) {
                    if (sErr[i] && sErr[i].lte(targetTolerance)) continue;

                    let pr = sa_r[0], pi = sa_i[0];
                    for (let j = 1; j <= n; j++) {
                        let nr = pr.mul(sr[i]).sub(pi.mul(si[i])).add(sa_r[j]);
                        let ni = pr.mul(si[i]).add(pi.mul(sr[i])).add(sa_i[j]);
                        pr = nr; pi = ni;
                    }

                    let dr = new Decimal(1), di = new Decimal(0);
                    for (let j = 1; j <= n; j++) {
                        if (i === j) continue;
                        let diffR = sr[i].sub(sr[j]), diffI = si[i].sub(si[j]);
                        let nr = dr.mul(diffR).sub(di.mul(diffI));
                        let ni = dr.mul(diffI).add(di.mul(diffR));
                        dr = nr; di = ni;
                    }

                    let den = dr.mul(dr).add(di.mul(di));
                    let corrR = (pr.mul(dr).add(pi.mul(di))).div(den);
                    let corrI = (pi.mul(dr).sub(pr.mul(di))).div(den);

                    sr[i] = sr[i].sub(corrR);
                    si[i] = si[i].sub(corrI);
                    sIter[i] = k;

                    let errVal = decimalHypot(corrR, corrI);
                    sErr[i] = errVal;
                    if (errVal.gt(targetTolerance)) {
                        bContinue = true;
                    }
                }

                if (!bContinue) break;
            }

            // --- 4. スケーリング復元 ---
            for (let i = 1; i <= n; i++) {
                sr[i] = sr[i].mul(scaleFactor);
                si[i] = si[i].mul(scaleFactor);
            }

            prog.innerText = t.msgComplete;
            renderResults();
        }

        function renderResults() {
            if (n === null || sr.length <= 1) return;
            const t = i18n[currentLang];
            const isFactored = document.getElementById('modeToggle').checked;
            document.getElementById('toggleText').innerText = isFactored ? t.modeFactored : t.modeRoots;

            let html = '';
            let totalIterations = 0;

            for (let i = 1; i <= n; i++) {
                totalIterations += sIter[i] || 0;
                let rVal = sr[i].toDecimalPlaces(50).toString();
                let iVal = si[i].toDecimalPlaces(50).toString();
                let errVal = sErr[i] ? sErr[i].toDecimalPlaces(5).toString() : "N/A";

                if (!isFactored) {
                    let sign = si[i].gte(0) ? "+" : "";
                    html += `<div class="result-card"><strong>[${i}] ${t.resultRoot} z_${i}</strong> = ${rVal} ${sign} ${iVal}i<br>` +
                            `<small>${t.errRadius}: ${errVal} | ${t.iterCount}: ${sIter[i]}</small></div>`;
                } else {
                    let imAbs = si[i].abs().toDecimalPlaces(1);
                    let factorStr = "";
                    if (imAbs.isZero()) {
                        let signOp = sr[i].isNegative() ? "+" : "-";
                        let absVal = sr[i].abs().toDecimalPlaces(1).toString();
                        factorStr = `(x ${signOp} ${absVal})`;
                    } else {
                        let rSign = sr[i].isNegative() ? "+" : "-";
                        let rAbs = sr[i].abs().toDecimalPlaces(1).toString();
                        let iSign = si[i].isNegative() ? "-" : "+";
                        factorStr = `(x ${rSign} ${rAbs} ${iSign} ${imAbs}i)`;
                    }
                    html += `<div class="result-card"><strong>[${i}] ${t.resultFactor}</strong>: ${factorStr}</div>`;
                }
            }

            html += `<div class="summary-card"><strong>${t.totalIter}:</strong> ${totalIterations} | <strong>${t.appliedScale}:</strong> ${scaleFactor.toDecimalPlaces(6).toString()}</div>`;
            document.getElementById('results').innerHTML = html;
        }
    </script>
</body>
</html>
