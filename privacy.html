<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="privacy-title">プライバシーポリシー</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.8;
            padding: 20px;
            max-width: 900px;
            margin: auto;
            background-color: #f8f9fa;
            color: #212529;
        }

        /* 共通ナビゲーションバー */
        .nav-bar {
            background: #343a40;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

            .nav-bar a {
                color: white;
                text-decoration: none;
                font-size: 15px;
                font-weight: 500;
            }

                .nav-bar a:hover {
                    text-decoration: underline;
                }

        h1, h2 {
            color: #0d6efd;
        }

        .section {
            background: #fff;
            padding: 20px 25px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .lang-btn {
            background-color: #0d6efd;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            float: right;
        }

            .lang-btn:hover {
                background-color: #0b5ed7;
            }

        .contact-link {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

            .contact-link:hover {
                background-color: #218838;
            }
    </style>
</head>
<body>

    <!-- 共通ナビゲーションバー -->
    <nav class="nav-bar">
        <a href="index.html" data-lang-ja="🏠 トップ" data-lang-en="🏠 TOP">🏠 トップ</a>
        <a href="MethodDka.html" data-lang-ja="🧮 計算" data-lang-en="🧮 Calculator">🧮 計算</a>
        <a href="help.html" data-lang-ja="📖 ヘルプ" data-lang-en="📖 Help">📖 ヘルプ</a>
        <a href="privacy.html" data-lang-ja="🔒 プライバシー" data-lang-en="🔒 Privacy">🔒 プライバシー</a>
    </nav>

    <button class="lang-btn" onclick="toggleLanguage()" id="btn-lang-toggle">🌐 English</button>

    <h1 id="h-title">プライバシーポリシー</h1>

    <div class="section">
        <h2 id="h-overview-title">概要</h2>
        <p id="h-overview-desc">
            MethodDka は、ユーザーの個人情報を収集しません。
            本アプリケーションはローカル環境で動作し、入力された係数・計算結果・設定情報はすべてユーザーの端末内で処理されます。
        </p>
    </div>

    <div class="section">
        <h2 id="h-data-title">収集するデータについて</h2>
        <p id="h-data-desc">
            本アプリケーションは、以下の個人情報を収集しません：
        </p>
        <ul id="h-data-list">
            <!-- JSで動的に設定 -->
        </ul>
        <p id="h-data-note">
            すべての計算はローカル環境で完結し、外部サーバーへ送信されることはありません。
        </p>
    </div>

    <div class="section">
        <h2 id="h-contact-title">お問い合わせ</h2>
        <p id="h-contact-desc">
            ご質問やフィードバックは、GitHub Discussions にて受け付けております。
        </p>
        <a href="https://github.com/YoshiakiKoizumija142397/MethodDka/discussions" target="_blank" class="contact-link" id="btn-contact">💬 MethodDka 掲示板を開く</a>
    </div>

    <div class="section">
        <h2 id="h-version-title">バージョン情報</h2>
        <p id="h-version-desc">
            <!-- JSで動的に設定 -->
        </p>
    </div>

    <script>
        const privacyTexts = {
            ja: {
                nav: ["🏠 トップ", "🧮 計算", "📖 ヘルプ", "🔒 プライバシー"],
                title: "プライバシーポリシー",
                langToggle: "🌐 English",
                overviewTitle: "概要",
                overviewDesc: "MethodDka は、ユーザーの個人情報を収集しません。本アプリケーションはローカル環境で動作し、入力された係数・計算結果・設定情報はすべてユーザーの端末内で処理されます。",
                dataTitle: "収集するデータについて",
                dataDesc: "本アプリケーションは、以下の個人情報を収集しません：",
                dataList: [
                    "氏名、住所、メールアドレスなどの個人識別情報",
                    "入力した係数や計算結果",
                    "端末情報、位置情報、利用ログ"
                ],
                dataNote: "すべての計算はローカル環境で完結し、外部サーバーへ送信されることはありません。",
                contactTitle: "お問い合わせ",
                contactDesc: "ご質問やフィードバックは、GitHub Discussions にて受け付けております。",
                contactBtn: "💬 MethodDka 掲示板を開く",
                versionTitle: "バージョン情報",
                versionDesc: "MethodDka プライバシーポリシー<br><strong>Version 3.0.0</strong>"
            },
            en: {
                nav: ["🏠 TOP", "🧮 Calculator", "📖 Help", "🔒 Privacy"],
                title: "Privacy Policy",
                langToggle: "🌐 日本語",
                overviewTitle: "Overview",
                overviewDesc: "MethodDka does not collect any personal information. All calculations and inputs are processed locally on your device and are never transmitted externally.",
                dataTitle: "Data Collection",
                dataDesc: "This application does not collect the following personal information:",
                dataList: [
                    "Personal identification data such as name, address, or email",
                    "Entered coefficients or calculation results",
                    "Device information, location data, or usage logs"
                ],
                dataNote: "All computations are performed locally and never sent to external servers.",
                contactTitle: "Contact",
                contactDesc: "If you have any questions or feedback, please visit our GitHub Discussions.",
                contactBtn: "💬 Open MethodDka Discussions",
                versionTitle: "Version Information",
                versionDesc: "MethodDka Privacy Policy<br><strong>Version 3.0.0</strong>"
            }
        };

        function updateContent() {
            let lang = localStorage.getItem('methoddka_lang') || 'ja';
            const t = privacyTexts[lang];

            document.documentElement.lang = lang;

            // Navigation update
            const navLinks = document.querySelectorAll('.nav-bar a');
            t.nav.forEach((text, i) => { navLinks[i].innerText = text; });

            document.getElementById('privacy-title').innerText = t.title;
            document.getElementById('btn-lang-toggle').innerText = t.langToggle;
            document.getElementById('h-title').innerText = t.title;

            document.getElementById('h-overview-title').innerText = t.overviewTitle;
            document.getElementById('h-overview-desc').innerHTML = t.overviewDesc;

            document.getElementById('h-data-title').innerText = t.dataTitle;
            document.getElementById('h-data-desc').innerText = t.dataDesc;

            const list = document.getElementById('h-data-list');
            list.innerHTML = "";
            t.dataList.forEach(item => {
                const li = document.createElement('li');
                li.innerHTML = item;
                list.appendChild(li);
            });

            document.getElementById('h-data-note').innerHTML = t.dataNote;

            document.getElementById('h-contact-title').innerText = t.contactTitle;
            document.getElementById('h-contact-desc').innerText = t.contactDesc;
            document.getElementById('btn-contact').innerText = t.contactBtn;

            document.getElementById('h-version-title').innerText = t.versionTitle;
            document.getElementById('h-version-desc').innerHTML = t.versionDesc;
        }

        function toggleLanguage() {
            let lang = localStorage.getItem('methoddka_lang') || 'ja';
            let newLang = lang === 'ja' ? 'en' : 'ja';
            localStorage.setItem('methoddka_lang', newLang);
            updateContent();
        }

        window.addEventListener('DOMContentLoaded', updateContent);
    </script>
</body>
</html>
