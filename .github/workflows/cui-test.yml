name: MethodDka CUI CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  cui-test:
    runs-on: ubuntu-latest

    steps:
      - name: ソースコードのチェックアウト
        uses: actions/checkout@v4

      - name: Node.js 環境のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 依存関係のインストール
        run: npm ci

      - name: CUI自動テストの実行 (npm test)
        run: npm test